<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>High-Speed Diagnostics Dashboard</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body {
    background: #000;
    color: #fff;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

.dashboard-container {
    width: 100%;
    max-width: 980px;

    display: flex;

    background: #050505;

    border: 1px solid #111;
    border-radius: 24px;

    padding: 35px;

    gap: 40px;
}


/* ================================
   LEFT PANEL
================================ */

.left-panel {
    flex: 1;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    border-right: 1px solid #111;

    padding-right: 20px;
}


/* ================================
   SPEEDOMETER
================================ */

.speedometer {
    width: 320px;
    height: 320px;

    position: relative;
}

.speedometer svg {
    width: 100%;
    height: 100%;
    display: block;
}


/* Gauge numbers */

.gauge-number {
    fill: #555;
    font-size: 13px;
    font-weight: 600;
}


/* Needle */

#needle {
    transform-origin: 160px 160px;

    transform:
        rotate(-120deg);

    transition:
        transform 0.45s cubic-bezier(.2,.8,.2,1);
}


/* Digital display */

.digital-display {
    text-align: center;

    margin-top: -10px;

    margin-bottom: 25px;
}

.current-speed {
    font-size: 54px;

    font-weight: 800;

    line-height: 1;
}

.unit {
    display: block;

    margin-top: 5px;

    color: #444;

    font-size: 13px;

    letter-spacing: 2px;

    text-transform: uppercase;
}


/* ================================
   INPUT
================================ */

.input-group {
    width: 100%;
    max-width: 260px;

    display: flex;
    flex-direction: column;

    gap: 6px;
}

input[type="number"] {

    width: 100%;

    background: #111;

    border: 1px solid #222;

    border-radius: 10px;

    padding: 14px;

    color: white;

    font-size: 18px;

    font-weight: 600;

    text-align: center;
}

input[type="number"]:focus {

    outline: none;

    border-color: white;
}

.error-message {

    min-height: 16px;

    color: #ff4444;

    font-size: 12px;

    text-align: center;
}


/* ================================
   RIGHT PANEL
================================ */

.right-panel {
    flex: 1.4;

    display: flex;

    flex-direction: column;

    gap: 20px;
}

.panel-header h2 {
    font-size: 20px;

    margin-bottom: 4px;
}

.panel-header p {
    font-size: 13px;

    color: #666;
}


/* ================================
   TABS
================================ */

.tab-bar {

    display: flex;

    gap: 4px;

    overflow-x: auto;

    padding-bottom: 4px;

    border-bottom: 1px solid #1a1a1a;
}

.tab-btn {

    background: none;

    border: none;

    color: #666;

    padding: 10px 12px;

    font-size: 13px;

    font-weight: 600;

    cursor: pointer;

    white-space: nowrap;

    position: relative;
}

.tab-btn:hover {
    color: white;
}

.tab-btn.active {
    color: white;
}

.tab-btn.active::after {

    content: "";

    position: absolute;

    bottom: -5px;

    left: 0;

    width: 100%;

    height: 2px;

    background: white;
}


/* ================================
   MEDIA
================================ */

.media-viewer {

    flex: 1;

    min-height: 240px;

    background: #000;

    border: 1px solid #1a1a1a;

    border-radius: 14px;

    overflow: hidden;
}

.video-container {

    width: 100%;

    height: 180px;

    background: #0a0a0a;

    position: relative;
}

video {

    width: 100%;
    height: 100%;

    object-fit: cover;

    background: #000;
}

.video-status-overlay {

    position: absolute;

    top: 10px;
    right: 10px;

    padding: 4px 10px;

    background: rgba(0,0,0,.7);

    border: 1px solid #222;

    border-radius: 6px;

    color: #ff9900;

    font-size: 11px;

    font-weight: 600;
}

.media-caption-box {

    padding: 15px;

    background: #050505;

    border-top: 1px solid #111;
}

.media-caption-box h4 {

    font-size: 14px;

    margin-bottom: 6px;
}

.media-caption-box p {

    font-size: 12px;

    line-height: 1.4;

    color: #888;
}


/* ================================
   MOBILE
================================ */

@media (max-width: 768px) {

    .dashboard-container {

        flex-direction: column;

        padding: 25px;

    }

    .left-panel {

        border-right: none;

        border-bottom: 1px solid #111;

        padding-right: 0;

        padding-bottom: 30px;
    }

}

@media (max-width: 400px) {

    .speedometer {

        width: 280px;
        height: 280px;
    }

}

</style>
</head>


<body>


<div class="dashboard-container">


<!-- =====================================
     LEFT SIDE
===================================== -->

<div class="left-panel">


    <!-- SPEEDOMETER -->

    <div class="speedometer">

        <svg
            viewBox="0 0 320 320"
            xmlns="http://www.w3.org/2000/svg">


            <!-- =========================
                 OUTER GAUGE
            ========================== -->

            <path
                d="M 58 244
                   A 125 125 0 1 1 262 244"
                fill="none"
                stroke="#1c1c1c"
                stroke-width="2"
            />


            <!-- =========================
                 TICK MARKS
            ========================== -->

            <g
                id="ticks"
                stroke="#333"
                stroke-width="2">
            </g>


            <!-- =========================
                 NUMBERS
            ========================== -->

            <text
                x="67"
                y="252"
                text-anchor="middle"
                class="gauge-number">
                0
            </text>

            <text
                x="45"
                y="170"
                text-anchor="middle"
                class="gauge-number">
                50
            </text>

            <text
                x="78"
                y="92"
                text-anchor="middle"
                class="gauge-number">
                100
            </text>

            <text
                x="160"
                y="62"
                text-anchor="middle"
                class="gauge-number">
                150
            </text>

            <text
                x="242"
                y="92"
                text-anchor="middle"
                class="gauge-number">
                200
            </text>

            <text
                x="275"
                y="170"
                text-anchor="middle"
                class="gauge-number">
                250
            </text>

            <text
                x="253"
                y="252"
                text-anchor="middle"
                class="gauge-number">
                300
            </text>


            <!-- =========================
                 NEEDLE
            ========================== -->

            <g id="needle">

                <line
                    x1="160"
                    y1="160"
                    x2="160"
                    y2="55"
                    stroke="white"
                    stroke-width="4"
                    stroke-linecap="round"
                />

            </g>


            <!-- =========================
                 CENTER HUB
            ========================== -->

            <circle
                cx="160"
                cy="160"
                r="12"
                fill="white"
            />

            <circle
                cx="160"
                cy="160"
                r="5"
                fill="black"
            />


        </svg>

    </div>


    <!-- DIGITAL SPEED -->

    <div class="digital-display">

        <div
            id="digitalSpeed"
            class="current-speed">
            0
        </div>

        <span class="unit">
            km/h
        </span>

    </div>


    <!-- INPUT -->

    <div class="input-group">

        <input
            type="number"
            id="speedInput"
            min="0"
            max="300"
            value="0"
            placeholder="Enter Speed (0-300)"
        >

        <div
            id="errorBox"
            class="error-message">
        </div>

    </div>


</div>



<!-- =====================================
     RIGHT SIDE
===================================== -->

<div class="right-panel">


    <div class="panel-header">

        <h2>
            Real-World Vehicle Limits
        </h2>

        <p>
            Select a part to analyze how daily
            driving components handle high speeds.
        </p>

    </div>


    <!-- TABS -->

    <div class="tab-bar">

        <button
            class="tab-btn active"
            onclick="switchTab('tyres', this)">
            Tyres
        </button>

        <button
            class="tab-btn"
            onclick="switchTab('brakes', this)">
            Brakes
        </button>

        <button
            class="tab-btn"
            onclick="switchTab('bolts', this)">
            Wheel Bolts
        </button>

        <button
            class="tab-btn"
            onclick="switchTab('windshield', this)">
            Windshield
        </button>

        <button
            class="tab-btn"
            onclick="switchTab('ev', this)">
            EV Battery
        </button>

        <button
            class="tab-btn"
            onclick="switchTab('regulations', this)">
            Global Laws
        </button>

    </div>


    <!-- MEDIA -->

    <div class="media-viewer">

        <div class="video-container">

            <video
                id="dashboardVideo"
                autoplay
                muted
                playsinline>

                <source
                    id="videoSource"
                    src="sample.mp4"
                    type="video/mp4">

            </video>

            <div
                id="videoFileLabel"
                class="video-status-overlay">

                RUNNING TRIAL: sample.mp4

            </div>

        </div>


        <div class="media-caption-box">

            <h4 id="captionTitle">
                Tyres Status
            </h4>

            <p id="captionText">
                Tyres are one of the most important
                components when vehicle speed increases.
            </p>

        </div>

    </div>


</div>

</div>



<script>

/* =====================================================
   SPEEDOMETER
===================================================== */

const speedInput =
    document.getElementById("speedInput");

const digitalSpeed =
    document.getElementById("digitalSpeed");

const needle =
    document.getElementById("needle");

const errorBox =
    document.getElementById("errorBox");


/*
    Gauge:

    0 km/h   = -120 degrees
    150 km/h = 0 degrees
    300 km/h = +120 degrees
*/


function updateSpeed(speed) {

    const minAngle = -120;

    const maxAngle = 120;


    /*
        Convert 0-300
        into 0-1.
    */

    const percentage =
        speed / 300;


    /*
        Convert percentage
        to angle.
    */

    const angle =
        minAngle +
        (percentage *
        (maxAngle - minAngle));


    /*
        Apply rotation.
    */

    needle.style.transform =
        `rotate(${angle}deg)`;


    /*
        Update number.
    */

    digitalSpeed.textContent =
        speed;
}



/* =====================================================
   INPUT
===================================================== */

speedInput.addEventListener(
    "input",
    function () {

        let speed =
            Number(this.value);


        /*
            Empty input.
        */

        if (this.value === "") {

            updateSpeed(0);

            errorBox.textContent = "";

            return;
        }


        /*
            Below minimum.
        */

        if (speed < 0) {

            speed = 0;

            errorBox.textContent =
                "Minimum speed is 0 km/h.";
        }


        /*
            Above maximum.
        */

        else if (speed > 300) {

            speed = 300;

            errorBox.textContent =
                "Maximum speed is 300 km/h.";
        }


        /*
            Valid value.
        */

        else {

            errorBox.textContent = "";
        }


        updateSpeed(speed);

    }
);


/* =====================================================
   INITIALIZE
===================================================== */

updateSpeed(0);



/* =====================================================
   CREATE TICK MARKS
===================================================== */

const ticks =
    document.getElementById("ticks");


for (
    let i = 0;
    i <= 30;
    i++
) {

    /*
        Calculate angle.
    */

    const angle =
        -120 +
        (i * 8);


    /*
        Convert degrees to radians.
    */

    const radians =
        angle *
        Math.PI /
        180;


    /*
        Outer radius.
    */

    const outerRadius = 125;


    /*
        Inner radius.
    */

    const innerRadius =
        i % 5 === 0
        ? 112
        : 117;


    /*
        Center.
    */

    const cx = 160;
    const cy = 160;


    /*
        Outer point.
    */

    const x1 =
        cx +
        outerRadius *
        Math.sin(radians);

    const y1 =
        cy -
        outerRadius *
        Math.cos(radians);


    /*
        Inner point.
    */

    const x2 =
        cx +
        innerRadius *
        Math.sin(radians);

    const y2 =
        cy -
        innerRadius *
        Math.cos(radians);


    /*
        Create SVG line.
    */

    const line =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
        );


    line.setAttribute(
        "x1",
        x1
    );

    line.setAttribute(
        "y1",
        y1
    );

    line.setAttribute(
        "x2",
        x2
    );

    line.setAttribute(
        "y2",
        y2
    );


    ticks.appendChild(line);
}



/* =====================================================
   TAB SYSTEM
===================================================== */

function switchTab(
    tabName,
    button
) {

    /*
        Remove active class.
    */

    document
        .querySelectorAll(".tab-btn")
        .forEach(
            btn =>
                btn.classList.remove("active")
        );


    /*
        Activate selected tab.
    */

    button.classList.add("active");


    /*
        Video files.
    */

    const videos = {

        tyres:
            "sample.mp4",

        brakes:
            "brakes.mp4",

        bolts:
            "bolts.mp4",

        windshield:
            "windshield.mp4",

        ev:
            "ev-battery.mp4",

        regulations:
            "global-laws.mp4"
    };


    /*
        Titles.
    */

    const titles = {

        tyres:
            "Tyres Status",

        brakes:
            "Brakes Status",

        bolts:
            "Wheel Bolts Status",

        windshield:
            "Windshield Status",

        ev:
            "EV Battery Status",

        regulations:
            "Global Laws"
    };


    /*
        Descriptions.
    */

    const descriptions = {

        tyres:
            "Tyres are one of the most important components when vehicle speed increases.",

        brakes:
            "Braking systems must dissipate increasing amounts of kinetic energy as speed rises.",

        bolts:
            "Wheel bolts secure the wheel assembly and must withstand significant loads.",

        windshield:
            "Windshield construction contributes to occupant protection.",

        ev:
            "EV batteries and thermal management systems must handle demanding operating conditions.",

        regulations:
            "Speed regulations and vehicle requirements vary across different regions."
    };


    /*
        Video.
    */

    const video =
        document.getElementById(
            "dashboardVideo"
        );

    const source =
        document.getElementById(
            "videoSource"
        );


    source.src =
        videos[tabName];


    video.load();


    video.play().catch(
        () => {}
    );


    /*
        Label.
    */

    document.getElementById(
        "videoFileLabel"
    ).textContent =
        "RUNNING TRIAL: " +
        videos[tabName];


    /*
        Caption.
    */

    document.getElementById(
        "captionTitle"
    ).textContent =
        titles[tabName];


    document.getElementById(
        "captionText"
    ).textContent =
        descriptions[tabName];

}

</script>

</body>
</html>
