<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Speed Diagnostics Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .dashboard-container {
            display: flex;
            width: 100%;
            max-width: 980px;
            background: #050505;
            border: 1px solid #111111;
            border-radius: 24px;
            padding: 35px;
            gap: 40px;
            align-items: stretch;
        }

        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 1px solid #111111;
            padding-right: 20px;
        }

        .speedometer-section {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Fixed needle alignment and rotation framework */
        .needle {
            position: absolute;
            bottom: 50%;
            left: 50%;
            width: 4px;
            height: 105px;
            background: #ffffff;
            border-radius: 4px;
            transform-origin: bottom center;
            /* Start exactly at 0 mark point */
            transform: translate(-50%, 0) rotate(-120deg);
            transition: transform 0.3s ease-out;
        }

        .center-hub {
            position: absolute;
            bottom: calc(50% - 12px);
            left: calc(50% - 12px);
            width: 24px;
            height: 24px;
            background: #ffffff;
            border-radius: 50%;
            border: 4px solid #000000;
            z-index: 5;
        }

        .gauge-label {
            position: absolute;
            font-size: 13px;
            font-weight: 600;
            color: #555555;
            transform: translate(-50%, -50%);
        }

        .digital-display {
            text-align: center;
            margin-top: -20px;
            margin-bottom: 25px;
            z-index: 2;
        }

        .current-speed {
            font-size: 54px;
            font-weight: 800;
            line-height: 1;
        }

        .unit {
            font-size: 13px;
            color: #444444;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: block;
            margin-top: 4px;
        }

        .input-group {
            width: 100%;
            max-width: 260px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        input[type="number"] {
            background: #111111;
            border: 1px solid #222222;
            border-radius: 10px;
            padding: 14px;
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            transition: border-color 0.2s ease;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #ffffff;
        }

        .error-message {
            color: #ff4444;
            font-size: 12px;
            text-align: center;
            min-height: 16px;
        }

        .right-panel {
            flex: 1.4;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel-header h2 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .panel-header p {
            font-size: 13px;
            color: #666666;
        }

        .tab-bar {
            display: flex;
            border-bottom: 1px solid #1a1a1a;
            gap: 4px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: #666666;
            padding: 10px 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            white-space: nowrap;
        }

        .tab-btn:hover {
            color: #ffffff;
        }

        .tab-btn.active {
            color: #ffffff;
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 2px;
            background: #ffffff;
        }

        .media-viewer {
            flex: 1;
            background: #000000;
            border: 1px solid #1a1a1a;
            border-radius: 14px;
            position: relative;
            min-height: 240px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .video-container {
            width: 100%;
            height: 180px;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #000000;
        }

        .video-status-overlay {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #222;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            color: #ff9900;
            pointer-events: none;
            font-weight: 600;
        }

        .media-caption-box {
            padding: 15px;
            background: #050505;
            border-top: 1px solid #111111;
        }

        .media-caption-box h4 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .media-caption-box p {
            font-size: 12px;
            color: #888888;
            line-height: 1.4;
        }

        @media (max-width: 768px) {
            .dashboard-container {
                flex-direction: column;
            }
            .left-panel {
                border-right: none;
                border-bottom: 1px solid #111111;
                padding-right: 0;
                padding-bottom: 30px;
            }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- Left Panel: Speedometer Layout Component -->
        <div class="left-panel">
            <div class="speedometer-section">
                <div class="gauge-label" style="top: 82%; left: 22%;">0</div>
                <div class="gauge-label" style="top: 50%; left: 11%;">50</div>
                <div class="gauge-label" style="top: 21%; left: 24%;">100</div>
                <div class="gauge-label" style="top: 10%; left: 50%;">150</div>
                <div class="gauge-label" style="top: 21%; left: 76%;">200</div>
                <div class="gauge-label" style="top: 50%; left: 89%;">250</div>
                <div class="gauge-label" style="top: 82%; left: 78%;">300</div>

                <div id="needle" class="needle"></div>
                <div class="center-hub"></div>
            </div>

            <div class="digital-display">
                <div id="digitalSpeed" class="current-speed">0</div>
                <span class="unit">km/h</span>
            </div>

            <div class="input-group">
                <!-- Swapped dynamic triggers cleanly to event handles in script -->
                <input type="number" id="speedInput" min="0" max="300" placeholder="Enter Speed (0-300)" value="0">
                <div id="errorBox" class="error-message"></div>
            </div>
        </div>

        <!-- Right Panel: Tabs Deck with Single-Play Video Mode -->
        <div class="right-panel">
            <div class="panel-header">
                <h2>Real-World Vehicle Limits</h2>
                <p>Select a part to analyze how daily driving components handle high speeds.</p>
            </div>

            <div class="tab-bar">
                <button class="tab-btn active" id="btn-tyres" onclick="switchTab('tyres', this)">Tyres</button>
                <button class="tab-btn" id="btn-brakes" onclick="switchTab('brakes', this)">Brakes</button>
                <button class="tab-btn" id="btn-bolts" onclick="switchTab('bolts', this)">Wheel Bolts</button>
                <button class="tab-btn" id="btn-windshield" onclick="switchTab('windshield', this)">Windshield</button>
                <button class="tab-btn" id="btn-ev" onclick="switchTab('ev', this)">EV Battery</button>
                <button class="tab-btn" id="btn-regulations" onclick="switchTab('regulations', this)">Global Laws</button>
            </div>

            <div class="media-viewer">
                <div class="video-container">
                    <!-- Removed loop so it explicitly plays just once -->
                    <video id="dashboardVideo" autoplay muted playsinline>
                        <source id="videoSource" src="sample.mp4" type="video/mp4">
                    </video>
                    <div id="videoFileLabel" class="video-status-overlay">RUNNING TRIAL: sample.mp4</div>
                </div>

                <div class="media-caption-box">
                    <h4 id="captionTitle">Tyres Status</h4>
