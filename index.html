<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnostics Component</title>
    <style>
        :root {
            --bg-color: #121214;
            --panel-bg: #1a1a1e;
            --accent-color: #00ffaa;
            --text-color: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .right-panel {
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 20px;
            max-width: 500px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .panel-header h2 {
            margin-top: 0;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
            color: #8e8e93;
        }

        .media-viewer {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .video-container {
            position: relative;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        video {
            width: 100%;
            display: block;
        }

        .video-status-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-family: monospace;
            color: var(--accent-color);
        }

        /* Speedometer Styles */
        .dashboard-metrics {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #24242b;
            padding: 15px;
            border-radius: 8px;
        }

        #speedometerCanvas {
            width: 200px;
            height: 120px;
        }

        .digital-readout {
            font-size: 2rem;
            font-weight: bold;
            font-family: monospace;
            color: var(--accent-color);
            margin-top: -10px;
        }

        .unit {
            font-size: 0.9rem;
            color: #8e8e93;
        }
    </style>
</head>
<body>

    <!-- RIGHT COLUMN: Diagnostics Component Tab interface deck -->
    <div class="right-panel">
        <div class="panel-header">
            <h2>Real-World Vehicle Limits (TRIAL MODE)</h2>
        </div>

        <div class="media-viewer">
            <div class="video-container">
                <!-- Video will play once, and then hard stop (no loop attribute) -->
                <video id="dashboardVideo" autoplay muted playsinline>
                    <source src="test.mp4" type="video/mp4">
                    <source src="sample.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                <div id="videoFileLabel" class="video-status-overlay">STATUS: PLAYING</div>
            </div>

            <!-- Added speedometer container elements -->
            <div class="dashboard-metrics">
                <canvas id="speedometerCanvas" width="200" height="120"></canvas>
                <div class="digital-readout"><span id="speedValue">0</span> <span class="unit">KM/H</span></div>
            </div>

            <div class="media-caption-box">
                <!-- Captions or diagnostics readouts go here -->
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('dashboardVideo');
        const statusOverlay = document.getElementById('videoFileLabel');
        const canvas = document.getElementById('speedometerCanvas');
        const ctx = canvas.getContext('2d');
        const speedValueDisplay = document.getElementById('speedValue');

        let currentSpeed = 0;
        let targetSpeed = 120; // Maximum simulation speed threshold
        let animationFrameId;

        // 1. Video Playback Control Rules
        video.addEventListener('play', () => {
            statusOverlay.textContent = "STATUS: PLAYING";
            statusOverlay.style.color = "#00ffaa";
            animateSpeedometer();
        });

        video.addEventListener('ended', () => {
            statusOverlay.textContent = "STATUS: ENDED / STOPPED";
            statusOverlay.style.color = "#ff453a"; // Changes overlay red when video completely stops
            cancelAnimationFrame(animationFrameId); // Freeze gauge telemetry tracking
        });

        // 2. HTML5 Canvas Speedometer Logic Engine
        function drawSpeedometer(speed) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height - 10;
            const radius = 80;

            // Draw Background Dial Track Archetype
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, Math.PI, 2 * Math.PI, false);
            ctx.lineWidth = 10;
            ctx.strokeStyle = '#3a3a44';
            ctx.stroke();

            // Draw Active Speed Arc Layer
            const speedPercentage = Math.min(speed / 160, 1); // Normalized against 160 KM/H max metric
            const endAngle = Math.PI + (Math.PI * speedPercentage);

            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, Math.PI, endAngle, false);
            ctx.lineWidth = 10;
            ctx.strokeStyle = '#00ffaa';
            ctx.stroke();

            // Draw Indicator Needle Node Pin
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(endAngle - Math.PI);
            
            ctx.beginPath();
            ctx.moveTo(0, 4);
            ctx.lineTo(radius - 15, 0);
            ctx.lineTo(0, -4);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            
            ctx.restore();

            // Center core node cap
            ctx.beginPath();
            ctx.arc(centerX, centerY, 8, 0, 2 * Math.PI);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
        }

        // 3. Dynamic Telemetry Synchronizer
        function animateSpeedometer() {
            if (video.paused || video.ended) return;

            // Simulates vehicle speed variations tied directly to active video frame playback
            const progress = video.currentTime / video.duration;
            if (!isNaN(progress)) {
                // Wave speed profiling behavior simulation logic
                currentSpeed = Math.floor(Math.sin(progress * Math.PI) * targetSpeed);
                speedValueDisplay.textContent = currentSpeed;
                drawSpeedometer(currentSpeed);
            }

            animationFrameId = requestAnimationFrame(animateSpeedometer);
        }

        // Initialize empty stationary meter container state explicitly on launch layout
        drawSpeedometer(0);
    </script>
</body>
</html>
