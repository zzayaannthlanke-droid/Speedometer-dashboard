<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lighting Setup Auditor</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f1f5f9;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --border-color: #334155;
            --danger-color: #f87171;
            --safe-color: #4ade80;
            --neutral-grey: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .heading {
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #fff;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        /* Seek Bar Container */
        .slider-container {
            width: 100%;
            margin-bottom: 20px;
        }

        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 16px;
            border-radius: 8px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            outline: none;
            cursor: pointer;
        }

        /* Default pin styling centered */
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--neutral-grey);
            cursor: pointer;
            border: 2px solid #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            transition: background-color 0.15s;
        }

        .slider.moved::-webkit-slider-thumb {
            background: var(--primary);
        }

        /* Split Columns Grid */
        .columns-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 8px;
            opacity: 0.5;
            transition: opacity 0.2s ease;
        }

        .column.active {
            opacity: 1;
        }

        .item {
            padding: 10px 12px;
            background-color: #162032;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }

        .column.active.lhs-zone .item {
            border-color: var(--danger-color);
            background-color: rgba(248, 113, 113, 0.08);
            color: var(--danger-color);
        }

        .column.active.rhs-zone .item {
            border-color: var(--safe-color);
            background-color: rgba(74, 222, 128, 0.08);
            color: var(--safe-color);
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Display Box */
        .output-box {
            margin-top: 20px;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.85rem;
            text-align: center;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="heading">Lighting set-up</div>
        
        <div class="slider-container">
            <!-- min=0 (LHS), max=2 (RHS), default value=1 (exact center pin) -->
            <input type="range" id="lighting-slider" class="slider" min="0" max="2" value="1" oninput="updateSetup()">
        </div>

        <div class="columns-grid">
            <!-- LHS Segment -->
            <div id="lhs-column" class="column">
                <div class="item">Showroom</div>
                <div class="item">Warehouse</div>
                <div class="item">Dim</div>
                <div class="item">Shadow / Overcast</div>
            </div>

            <!-- RHS Segment -->
            <div id="rhs-column" class="column">
                <div class="item rhs-item">Daylight</div>
            </div>
        </div>

        <div id="status-message" class="output-box">
            Awaiting input. Move the seek bar pin to the left or right to proceed.
        </div>
    </div>
</div>

<script>
    function updateSetup() {
        const slider = document.getElementById('lighting-slider');
        const val = slider.value;
        const lhs = document.getElementById('lhs-column');
        const rhs = document.getElementById('rhs-column');
        const msg = document.getElementById('status-message');

        // Clear active classes
        lhs.className = "column";
        rhs.className = "column";
        slider.classList.add('moved');

        if (val == 1) {
            // Reverted back to exact center pin
            slider.classList.remove('moved');
            msg.textContent = "Awaiting input. Move the seek bar pin to the left or right to proceed.";
        } else if (val == 0) {
            // Dragged to LHS
            lhs.classList.add('active', 'lhs-zone');
            msg.textContent = "Sub-optimal environment selected. Countermeasures loaded.";
        } else if (val == 2) {
            // Dragged to RHS
            rhs.classList.add('active', 'rhs-zone');
            msg.textContent = "Optimal daylight environment selected. Safe check conditions.";
        }
    }
</script>

</body>
</html>
