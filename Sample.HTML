<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Speedometer</title>
    <style>
        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Pure Dark Minimalist Canvas */
        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Centered Unified Panel */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            background: #050505;
            border: 1px solid #111111;
            border-radius: 20px;
        }

        /* Speedometer Section Layout */
        .speedometer-section {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Gauge Pointer Needle */
        .needle {
            position: absolute;
            bottom: 50%;
            left: 50%;
            width: 4px;
            height: 110px;
            background: #ffffff;
            border-radius: 4px;
            transform-origin: bottom center;
            transform: translate(-50%, 0) rotate(-120deg);
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .center-hub {
            position: absolute;
            bottom: calc(50% - 12px);
            left: calc(50% - 12px);
            width: 24px;
            height: 24px;
            background: #ffffff;
            border-radius: 50%;
            border: 4px solid #000000;
        }

        /* Static Interval Markers (0-300) */
        .gauge-label {
            position: absolute;
            font-size: 14px;
            font-weight: 600;
            color: #666666;
            transform: translate(-50%, -50%);
        }

        /* Readout Directly Below Center Pivot */
        .digital-display {
            text-align: center;
            margin-top: -30px;
            margin-bottom: 25px;
            z-index: 2;
        }

        .current-speed {
            font-size: 54px;
            font-weight: 800;
            line-height: 1;
        }

        .unit {
            font-size: 13px;
            color: #444444;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: block;
            margin-top: 2px;
        }

        /* Controls Positioned Stacked Directly Under Display */
        .control-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        input[type="number"] {
            background: #111111;
            border: 1px solid #222222;
            border-radius: 10px;
            padding: 14px;
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            transition: border-color 0.2s ease;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #ffffff;
        }

        button {
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        button:hover {
            opacity: 0.9;
        }

        .error-message {
            color: #ff4444;
            font-size: 12px;
            text-align: center;
            min-height: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Speedometer Dial Component -->
        <div class="speedometer-section">
            <!-- 50 interval marks arranged around the needle arc -->
            <div class="gauge-label" style="top: 82%; left: 22%;">0</div>
            <div class="gauge-label" style="top: 50%; left: 11%;">50</div>
            <div class="gauge-label" style="top: 21%; left: 24%;">100</div>
            <div class="gauge-label" style="top: 10%; left: 50%;">150</div>
            <div class="gauge-label" style="top: 21%; left: 76%;">200</div>
            <div class="gauge-label" style="top: 50%; left: 89%;">250</div>
            <div class="gauge-label" style="top: 82%; left: 78%;">300</div>

            <div id="needle" class="needle"></div>
            <div class="center-hub"></div>
        </div>

        <!-- Live Digital Text Value Display -->
        <div class="digital-display">
            <div id="digitalSpeed" class="current-speed">0</div>
            <span class="unit">km/h</span>
        </div>

        <!-- Integrated Interactivity Input Block Below Needle -->
        <div class="control-section">
            <div class="input-group">
                <input type="number" id="speedInput" min="0" max="300" placeholder="Enter Speed (0-300)" value="0">
                <div id="errorBox" class="error-message"></div>
            </div>
            <button id="updateBtn">Apply Speed</button>
        </div>
    </div>

    <script>
        const speedInput = document.getElementById('speedInput');
        const updateBtn = document.getElementById('updateBtn');
        const needle = document.getElementById('needle');
        const digitalSpeed = document.getElementById('digitalSpeed');
        const errorBox = document.getElementById('errorBox');

        function updateSpeedometer(targetSpeed) {
            if (targetSpeed < 0 || targetSpeed > 300 || isNaN(targetSpeed)) {
                errorBox.textContent = "Please enter a value between 0 and 300.";
                return;
            }
            errorBox.textContent = "";

            // Numerical Counter Value Incrementor
            let currentDisplay = parseInt(digitalSpeed.textContent);
            const duration = 800; 
            const startTime = performance.now();

            function animateText(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeOutQuad = progress * (2 - progress);
                const frameValue = Math.round(currentDisplay + (targetSpeed - currentDisplay) * easeOutQuad);
                
                digitalSpeed.textContent = frameValue;

                if (progress < 1) {
                    requestAnimationFrame(animateText);
                }
            }
            requestAnimationFrame(animateText);

            // Needle Transform Mechanics (-120 to +120 deg)
            const rotationDegree = -120 + (targetSpeed / 300) * 240;
            needle.style.transform = `translate(-50%, 0) rotate(${rotationDegree}deg)`;
        }

        updateBtn.addEventListener('click', () => {
            updateSpeedometer(parseInt(speedInput.value) || 0);
        });

        speedInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                updateSpeedometer(parseInt(speedInput.value) || 0);
            }
        });

        // Initialize Canvas View
        updateSpeedometer(0);
    </script>
</body>
</html>
